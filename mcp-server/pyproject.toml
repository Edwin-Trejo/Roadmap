[project]
name = "roadmap-mcp-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.36",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
